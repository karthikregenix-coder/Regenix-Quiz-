<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Regenix Clinical Knowledge Challenge</title>

<style>
body{
margin:0;
font-family:Arial,sans-serif;
background:#f5f7fa;
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
}

.container{
background:white;
width:90%;
max-width:700px;
padding:30px;
border-radius:20px;
box-shadow:0 10px 30px rgba(0,0,0,.2);
}

.logo{
text-align:center;
}

.logo img{
height:80px;
}

h1{
text-align:center;
color:#0E7C66;
margin:10px 0;
}

p{
text-align:center;
color:#666;
}

input{
width:100%;
padding:14px;
margin-top:15px;
border-radius:10px;
border:1px solid #ccc;
font-size:16px;
}

h3{
margin-top:25px;
}

.cards{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:12px;
margin-top:15px;
}

.card{
padding:18px;
text-align:center;
border:2px solid #ccc;
border-radius:12px;
cursor:pointer;
font-weight:bold;
}

.card:hover{
border-color:#0E7C66;
}

.selected{
background:#0E7C66;
color:white;
}

button{
margin-top:25px;
width:100%;
padding:16px;
background:#0E7C66;
color:white;
border:none;
border-radius:10px;
font-size:18px;
cursor:pointer;
}
</style>
</head>

<body>

<div class="container">

<div class="logo">
<img src="Regenix Logo New.png" alt="Regenix Logo">
</div>

<h1>Clinical Knowledge Challenge</h1>

<p>Doctor Conference 2026</p>

<input id="name" placeholder="Doctor Name">

<input id="mobile" placeholder="Mobile Number">

<input id="hospital" placeholder="Hospital / Clinic">

<h3>Select Specialty</h3>

<div class="cards">

<div class="card" onclick="pick(this,'quiz_diabetology_1.html')">🟢<br>Diabetology</div>

<div class="card" onclick="pick(this,'quiz_cardiology.html')">❤️<br>Cardiology</div>

<div class="card" onclick="pick(this,'quiz_physicians.html')">🩺<br>Physicians</div>

<div class="card" onclick="pick(this,'quiz_oha.html')">💊<br>OHA</div>

<div class="card" onclick="pick(this,'quiz_glp.html')">🧬<br>GLP-1 RA</div>

</div>

<button onclick="startQuiz()">START CHALLENGE</button>

</div>

<script>

let quiz="";

function pick(card,file){

document.querySelectorAll(".card").forEach(c=>c.classList.remove("selected"));

card.classList.add("selected");

quiz=file;

}

function startQuiz(){

if(document.getElementById("name").value==""){
alert("Enter Doctor Name");
return;
}

if(document.getElementById("mobile").value==""){
alert("Enter Mobile Number");
return;
}

if(document.getElementById("hospital").value==""){
alert("Enter Hospital Name");
return;
}

if(quiz==""){
alert("Select Specialty");
return;
}

localStorage.setItem("doctorName",document.getElementById("name").value);
localStorage.setItem("doctorMobile",document.getElementById("mobile").value);
localStorage.setItem("doctorHospital",document.getElementById("hospital").value);

location.href=quiz;

}

</script>

</body>
</html>
